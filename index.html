@page{size:A4;margin:0}
:root{--fondo:#FEFAF3;--arena:#EFE8E0;--cacao:#452122;--c70:#7A5F5C;--c15:#DBD2C5;--crema:#FEFAF3;--limon:#FDF2A5;--azul:#1E5CCB;--cielo:#B5C9EE;--azulp:#0320A2;--terra:#934C33;--oliva:#8E9176;color-scheme:light}
*{box-sizing:border-box}
html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{margin:0;background:var(--fondo);color:var(--cacao);font:14px/1.45 "Stack Sans Text",system-ui,sans-serif;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:"Stack Sans Headline",system-ui,sans-serif;font-weight:600;letter-spacing:-.01em;margin:0;text-wrap:balance}
small{color:var(--c70)}

/* ---------- app ---------- */
.app{min-height:100vh}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:14px max(20px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--c15);background:var(--fondo)}
.brand{display:flex;align-items:center;gap:14px}
.brand img{height:26px;display:block}
.brand span{font-family:"Stack Sans Headline";font-weight:600;font-size:15px;color:var(--c70)}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{border:1px solid transparent;background:none;padding:7px 14px;border-radius:99px;cursor:pointer;font-weight:600;color:var(--c70)}
nav button:hover{color:var(--cacao)}
nav button.on{background:var(--cacao);color:var(--crema)}
main{max-width:1400px;margin:0 auto;padding:24px max(20px,env(safe-area-inset-left,0px)) 80px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.head h1{font-size:26px}
.head p{margin:4px 0 0;color:var(--c70);max-width:60ch}
.btn{border:1px solid var(--cacao);background:transparent;border-radius:10px;padding:0 14px;height:40px;display:inline-flex;align-items:center;justify-content:center;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--arena)}
.btn.primary{background:var(--azul);border-color:var(--azul);color:var(--crema)}
.btn.primary:hover{background:var(--azulp);border-color:var(--azulp)}
.btn.sm{padding:0 10px;font-size:12.5px;border-radius:8px;height:30px}
.btn.danger{background:var(--terra);border-color:var(--terra);color:var(--crema)}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{background:var(--crema);border:1px solid var(--c15);border-radius:8px;padding:7px 9px;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--azul);outline-offset:1px}
input:disabled,select:disabled,textarea:disabled{background:var(--fondo);color:var(--c70)}
input:not([type=checkbox]),select{height:40px}
input[type=number]{-moz-appearance:textfield;text-align:right}
input[type=number]::-webkit-inner-spin-button{display:none}
input[type=checkbox]{width:auto;accent-color:var(--azul)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--c70);letter-spacing:.02em;line-height:1.3}
label.f>input,label.f>select,label.f>textarea{margin-top:auto;font-weight:400;color:var(--cacao);font-size:14px;letter-spacing:0;line-height:1.45}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--c70);font-weight:600}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--arena)}
.pill.sent{background:var(--cielo);color:var(--azulp)}
.pill.warn{background:var(--limon)}
.banner{background:var(--limon);border-radius:10px;padding:10px 14px;margin-bottom:16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner p{margin:0}

/* list */
.rows{display:grid;gap:0;border-top:1px solid var(--cacao)}
.lrow{display:grid;grid-template-columns:120px minmax(0,1.3fr) minmax(0,1fr) 90px 130px 90px auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--c15)}
.lrow b{font-family:"Stack Sans Headline";font-weight:600}
.lrow .acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.lrow .amt{text-align:right;font-weight:600}
.empty{padding:40px 0;color:var(--c70)}

/* editor */
.ed{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;align-items:start}
@media(min-width:1100px){.ed{grid-template-columns:minmax(0,1fr) minmax(0,.95fr)}}
.bar{position:sticky;top:0;z-index:5;background:var(--fondo);border-bottom:1px solid var(--cacao);padding:10px 0;margin-bottom:18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar .grow{flex:1;min-width:0}
.bar .tt{font-family:"Stack Sans Headline";font-weight:700;font-size:22px;line-height:1}
.bar small{display:block}
.blk{border-top:1px solid var(--cacao);padding-top:12px;margin-bottom:24px}
.blk>h2{font-size:16px;margin-bottom:12px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.mt{margin-top:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--cacao);background:transparent;border-radius:99px;padding:6px 14px;cursor:pointer;font-weight:600}
.chip.on{background:var(--cacao);color:var(--crema)}
.chip:disabled{opacity:.5;cursor:not-allowed}
.ambcard{border:1px solid var(--c15);border-radius:12px;padding:14px;margin-bottom:12px;background:var(--crema)}
.ambcard header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.ambcard header h3{font-size:15px}
.ambcard header input{max-width:130px}
.irow{display:grid;grid-template-columns:auto minmax(0,1fr) 130px 110px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--c15);cursor:pointer}
.irow .rn small{display:block;font-size:12px}
.irow.off .rn{color:var(--c70)}
.irow .rq{display:flex;gap:6px;align-items:center}
.irow .rq em{font-style:normal;color:var(--c70);font-size:12.5px;min-width:34px}
.irow .rt{text-align:right;font-weight:600}
.warns{display:grid;gap:6px}
.warns div{background:var(--limon);border-radius:8px;padding:6px 10px;font-size:13px}
.warns div.ok{background:var(--arena)}
.sem{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:8px 12px;align-items:center}
.pvcol{position:sticky;top:78px}
.pvhead{display:flex;justify-content:space-between;margin-bottom:8px}
.pvbox{overflow:hidden}

/* catalog */
.tablewrap{overflow-x:auto;border:1px solid var(--c15);border-radius:12px;background:var(--crema);margin-bottom:22px}
table.cat{border-collapse:collapse;width:100%;min-width:1262px;table-layout:fixed}
table.cat input:not([type=checkbox]),table.cat select{height:36px}
table.cat th{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--c70);text-align:left;padding:10px 6px;border-bottom:1px solid var(--cacao);white-space:nowrap}
table.cat th:first-child{text-align:center}
table.cat th.r{text-align:right}
table.cat td{padding:6px;border-top:1px solid var(--c15);vertical-align:middle}
.updc{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
table.cat td.c{text-align:center}
.upd{font-size:12.5px;color:var(--c70);white-space:nowrap}
.upd.old{color:var(--terra);font-weight:600}
.ambh{display:flex;align-items:center;gap:10px;margin:0 0 8px;flex-wrap:wrap}
.ambh input{font-family:"Stack Sans Headline";font-weight:600;font-size:17px;max-width:200px;height:36px;background:transparent;border-color:transparent;padding-left:0}
.ambh input:hover,.ambh input:focus{background:var(--crema);border-color:var(--c15);padding-left:9px}
.bump{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:22px}
.bump label.f{width:110px}.bump label.f.sel{width:220px}
.ptable{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.pay3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

input[type=checkbox]{width:20px;height:20px}
.lrow .l-st{justify-self:start}
@media(max-width:1000px){
  .lrow{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"cli amt" "num st" "dir fecha" "acts acts";gap:6px 12px;padding:16px 0}
  .l-cli{grid-area:cli}.l-amt{grid-area:amt;font-size:16px}.l-num{grid-area:num}.l-st{grid-area:st;justify-self:end!important}
  .l-dir{grid-area:dir}.l-fecha{grid-area:fecha;text-align:right}
  .lrow .acts{grid-area:acts;justify-content:flex-start;margin-top:6px}
  .lrow .acts .btn{flex:1 1 0}
}
@media(max-width:1320px){
  /* catálogo: cada trabajo pasa a ser una tarjeta */
  .tablewrap{border:0;background:transparent;overflow:visible;border-radius:0}
  table.cat,table.cat tbody{display:block;min-width:0;width:100%}
  table.cat thead,table.cat colgroup{display:none}
  table.cat tr{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 10px;border:1px solid var(--c15);border-radius:12px;background:var(--crema);padding:14px;margin-bottom:10px}
  table.cat td{display:block;border:0;padding:0;min-width:0}
  table.cat td[data-l]::before{content:attr(data-l);display:block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--c70);margin-bottom:4px}
  table.cat input:not([type=checkbox]),table.cat select{height:40px}
  table.cat td.t-pack{order:1;grid-column:span 2;display:flex;flex-direction:row-reverse;justify-content:flex-end;align-items:center;gap:10px}
  table.cat td.t-pack::before{margin:0!important}
  table.cat td.t-del{order:2;grid-column:span 2;text-align:right}
  table.cat td.t-name{order:3;grid-column:span 2}table.cat td.t-inc{order:4;grid-column:span 2}
  table.cat td.t-unit{order:5}table.cat td.t-mat{order:6}table.cat td.t-mo{order:7}table.cat td.t-fase{order:8}
  table.cat td.t-upd{order:9;grid-column:1/-1}
  .updc{flex-direction:row;align-items:center;gap:12px}
}
@media(max-width:700px){
  table.cat tr{grid-template-columns:repeat(2,minmax(0,1fr))}
  table.cat td.t-pack,table.cat td.t-del{grid-column:span 1}
  table.cat td.t-name,table.cat td.t-inc{grid-column:1/-1}
  table.cat td.t-fase{order:6}table.cat td.t-mat{order:7}table.cat td.t-mo{order:8}
}
@media(max-width:700px){
  .top{padding-top:10px;padding-bottom:10px;gap:8px}
  nav{flex-wrap:nowrap;overflow-x:auto;width:100%;margin:0 -4px;padding:0 4px;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{flex:none;padding:8px 14px}
  main{padding-top:18px}
  .head h1{font-size:23px}
  .head .btn.primary{width:100%}
  .bar{position:static;border-bottom:0;padding:0;margin-bottom:6px}
  .bar .grow{flex-basis:100%;order:-1}
  .bar>div:not(.grow){flex:1 1 100%}
  .bar .btn{flex:1 1 calc(50% - 5px)}
  .bar .btn.sm{flex:none}
  .bar .btn.primary{flex:1 1 100%}
  .irow{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"c n n" ". q t";gap:8px 12px;padding:12px 0}
  .irow>input[type=checkbox]{grid-area:c;align-self:start;margin-top:2px}
  .irow .rn{grid-area:n}.irow .rq{grid-area:q}.irow .rt{grid-area:t;text-align:right;align-self:center}
  .irow .rq input{width:96px}
  .ambcard{padding:12px}
  .ambcard header{flex-wrap:wrap}
  .ambcard header input{max-width:none;flex:1 1 140px}
  .sem{grid-template-columns:minmax(0,1fr) 84px}
  .pvcol{position:static}
  .bump label.f,.bump label.f.sel{width:100%!important}
  .bump{align-items:stretch}.bump>.btn{width:100%}
  .ambh .btn{flex:1 1 auto}.ambh input{max-width:none;flex:1 1 100%}
  .banner .btn{width:100%}
}
#who{display:flex;align-items:center;gap:10px}
#whoName{font-weight:600;font-size:13px;color:var(--c70)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--arena);color:var(--cacao);white-space:nowrap}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--oliva)}
.sync.saving::before{background:var(--azul)}
.sync.offline{background:var(--limon)}
.sync.offline::before{background:var(--terra)}
.sync.local::before{background:var(--c70)}
body.cloudwait .app{display:none}
#login{position:fixed;inset:0;z-index:60;background:var(--fondo);display:flex;align-items:center;justify-content:center;padding:20px}
#login[hidden]{display:none}
.loginbox{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
.loginbox img{height:30px;align-self:flex-start}
.loginbox h1{margin:0;font-size:26px}
.loginbox p{margin:0;color:var(--c70)}
.loginbox p.err{color:var(--terra);font-weight:600}
.lsub{font-size:12px;color:var(--c70)}
@media(max-width:700px){
  .brand{order:1}#who{order:2;margin-left:auto}nav{order:3}
  #whoName{display:none}
}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--cacao);color:var(--crema);padding:9px 16px;border-radius:99px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw}
.toast.on{opacity:1}

/* ---------- hoja (preview, medición, impresión) ---------- */
#measure{position:absolute;left:-10000px;top:0;visibility:hidden}
#printSheet{display:none}
.sheet{color:var(--cacao);font-family:"Stack Sans Text",system-ui,sans-serif;font-size:8.7pt;line-height:1.42;font-variant-numeric:tabular-nums}
.sheet *{box-sizing:border-box}
.sheet .page{width:210mm;height:297mm;background:var(--fondo);position:relative;overflow:hidden;page-break-after:always;break-after:page}
.sheet .page:last-child{page-break-after:auto;break-after:auto}
.sheet .pgmain{height:274mm;overflow:hidden}
.sheet h1,.sheet h2,.sheet h3{font-family:"Stack Sans Headline",sans-serif;font-weight:600;letter-spacing:-.01em;margin:0}
.sheet .eyebrow{font-size:7pt;letter-spacing:.14em;text-transform:uppercase;color:var(--c70);font-weight:600}
.sheet .hero{background:var(--cacao);color:var(--crema);height:76mm;padding:13mm 16mm 12mm;position:relative}
.sheet .hero img{height:11mm;display:block}
.sheet .hero .num{position:absolute;right:16mm;top:14mm;text-align:right;font-size:7.4pt;color:var(--cielo)}
.sheet .hero .num b{display:block;font-family:"Stack Sans Headline";font-weight:600;color:var(--crema);font-size:9pt}
.sheet .hero .ttl{position:absolute;left:16mm;bottom:12mm;right:16mm}
.sheet .hero .ttl .eyebrow{color:var(--limon);margin-bottom:3mm}
.sheet .hero h1{font-size:31pt;line-height:1.02;color:var(--crema)}
.sheet .meta{display:grid;grid-template-columns:1.1fr 1.5fr .8fr .8fr;gap:6mm;padding:7mm 16mm 6mm;border-bottom:.5pt solid var(--c15)}
.sheet .meta .eyebrow{margin-bottom:1mm}
.sheet .meta div b{font-family:"Stack Sans Headline";font-weight:600;font-size:9.6pt}
.sheet .sec{padding:6mm 16mm 0}
.sheet .sec h2{font-size:13pt;margin:1.5mm 0 3mm}
.sheet .diag{font-size:9.3pt;line-height:1.55;max-width:158mm}
.sheet .diag p{margin:0}
.sheet .diag p+p{margin-top:2.2mm}
.sheet .ambs{display:grid;grid-template-columns:1fr 1fr;gap:7mm}
.sheet .amb-h{display:flex;justify-content:space-between;align-items:baseline;border-bottom:.9pt solid var(--cacao);padding-bottom:1.6mm}
.sheet .amb-h h3{font-size:11pt}
.sheet .amb-h span{font-size:7.6pt;color:var(--c70)}
.sheet table{width:100%;border-collapse:collapse}
.sheet td{padding:2.1mm 0;border-bottom:.5pt solid var(--c15);vertical-align:top}
.sheet td.t{font-weight:600;font-size:8.6pt;padding-right:3mm}
.sheet .inc{display:block;font-weight:400;color:var(--c70);font-size:7.5pt;margin-top:.5mm}
.sheet td.q{text-align:right;white-space:nowrap;font-size:8.4pt}
.sheet .excl{background:var(--arena);border-radius:3mm;padding:3.4mm 4.6mm;margin-top:6mm;font-size:8.2pt;line-height:1.45}
.sheet .excl b{font-family:"Stack Sans Headline";font-weight:600}
.sheet .foot{position:absolute;left:16mm;right:16mm;bottom:9mm;display:flex;justify-content:space-between;align-items:center;font-size:7pt;color:var(--c70);border-top:.5pt solid var(--c15);padding-top:2.6mm}
.sheet .tag{background:var(--limon);color:var(--cacao);padding:.6mm 2.2mm;border-radius:20mm;font-weight:600}
.sheet .top2{display:flex;justify-content:space-between;align-items:center;padding:11mm 16mm 0}
.sheet .top2 img{height:7.5mm}
.sheet .top2 .eyebrow{text-align:right}
.sheet table.inv td{padding:2.3mm 0;font-size:8.8pt}
.sheet table.inv td.n{text-align:right;white-space:nowrap;font-weight:600}
.sheet table.inv td small{display:block;color:var(--c70);font-size:7.5pt;font-weight:400}
.sheet table.inv tr.sub td{border-bottom:none;color:var(--c70);padding:1.6mm 0}
.sheet .total{display:flex;justify-content:space-between;align-items:center;background:var(--cielo);color:var(--azulp);border-radius:3mm;padding:3.4mm 5mm;margin-top:2.4mm}
.sheet .total span{font-family:"Stack Sans Headline";font-weight:600;font-size:10.5pt}
.sheet .total b{font-family:"Stack Sans Headline";font-weight:700;font-size:17pt}
.sheet .dist{margin-top:3.6mm}
.sheet .dbar{display:flex;height:3.2mm;border-radius:2mm;overflow:hidden;margin:1.6mm 0 1.4mm}
.sheet .leg{display:flex;gap:6mm;font-size:7.8pt;flex-wrap:wrap}
.sheet .leg i{display:inline-block;width:2.4mm;height:2.4mm;border-radius:50%;margin-right:1.4mm;vertical-align:-.2mm}
.sheet .two{display:grid;grid-template-columns:1fr 1fr;gap:7mm}
.sheet .fase td{font-size:8.3pt;padding:1.7mm 0}
.sheet .fase td:last-child{text-align:right;color:var(--c70);white-space:nowrap}
.sheet .pg{background:var(--arena);border-radius:3mm;padding:3mm 3.4mm}
.sheet .pg .p{font-family:"Stack Sans Headline";font-weight:700;font-size:15pt;line-height:1}
.sheet .pg .m{font-weight:600;font-size:8.6pt;margin:1.2mm 0 .8mm}
.sheet .pg .c{font-size:7.4pt;color:var(--c70);line-height:1.32}
.sheet ol.cond{padding-left:4mm;margin:0;font-size:7.8pt;line-height:1.38;color:var(--cacao)}
.sheet ol.cond li{margin-bottom:1.1mm;padding-left:.6mm}
.sheet ol.cond b{font-weight:600}
.sheet .firmas{display:grid;grid-template-columns:1fr 1fr;gap:14mm;margin-top:6mm}
.sheet .firmas div{border-top:.7pt solid var(--cacao);padding-top:1.4mm;font-size:7.4pt;color:var(--c70)}
.sheet .page.compact td{padding:1.3mm 0}
.sheet .page.compact .inc{display:none}
.sheet .page.compact .diag{font-size:8.5pt;line-height:1.45}
.sheet .page.compact .hero{height:62mm}
.sheet .page.compact .sec{padding-top:4mm}
.sheet .page.compact .excl{margin-top:4mm}
.sheet .page.compact td.t{font-size:8.2pt}
#preview .page{margin:0 0 14px;border:1px solid var(--c15)}
@media print{
  html,body{background:var(--fondo)!important}
  .app,.toast,#measure{display:none!important}
  #printSheet{display:block!important;zoom:1!important}
  #printSheet .page{margin:0!important;border:0!important}
}
</style>

/* ====================== cálculo ====================== */
const ctx=b=>b.frozen?b.frozen:{cfg:S.cfg,items:S.catalog};
function compute(b){
  const {cfg,items}=ctx(b);
  const groups=b.ambs.map(a=>({amb:a,lines:[],direct:0}));
  let mat=0,mo=0;
  for(const g of groups){
    for(const it of items){
      if(it.amb!==g.amb.name)continue;
      const s=b.sel[it.id]; if(!s||!s.on||!(num(s.qty)>0))continue;
      const q=num(s.qty); g.lines.push({it,q}); mat+=q*it.mat; mo+=q*it.mo; g.direct+=q*(it.mat+it.mo);
    }
  }
  const lines=groups.flatMap(g=>g.lines);
  const hasObra=lines.some(l=>l.it.fase!==F.DIS);
  const mode=hasObra?'A':'B';
  const dir=hasObra?mo*cfg.dir/100:0;
  const matR=Math.round(mat),manoR=Math.round(mo+dir),opexR=Math.round((mat+mo+dir)*cfg.opex/100);
  const sub=matR+manoR+opexR,iva=Math.round(sub*cfg.iva/100),total=sub+iva;
  const p1=Math.round(total*cfg.pay[0]/100),p2=Math.round(total*cfg.pay[1]/100),p3=total-p1-p2;
  // distribución por ambiente (mayor resto)
  const act=groups.filter(g=>g.direct>0),sumD=act.reduce((a,g)=>a+g.direct,0);
  let pct=act.map(g=>Math.floor(g.direct/sumD*100));
  let rest=100-pct.reduce((a,x)=>a+x,0);
  const order=act.map((g,i)=>[g.direct/sumD*100-pct[i],i]).sort((a,b2)=>b2[0]-a[0]);
  for(let k=0;rest>0&&order.length;k++,rest--)pct[order[k%order.length][1]]++;
  act.forEach((g,i)=>g.pct=pct[i]);
  // cronograma
  let names;
  if(mode==='B')names=FASES_DIS;
  else{const pres=new Set(lines.map(l=>l.it.fase));names=FASES_OBRA.filter(f=>f===F.ENT||pres.has(f))}
  let cur=1;
  const fases=names.map(n=>{const d=Math.max(1,Math.round(num((b.semanas||{})[n]??cfg.semanas[n]??1)));
    const s=cur,e=cur+d-1;cur=e+1;
    return{name:n,d,label:d===1?`Semana ${s}`:(d===2?`Semanas ${s} y ${e}`:`Semanas ${s} a ${e}`)}});
  const semTotal=cur-1;
  return{cfg,groups,lines,hasObra,mode,mat:matR,mano:manoR,opex:opexR,sub,iva,total,pays:[p1,p2,p3],fases,semTotal,
    phasesPresent:new Set(lines.map(l=>l.it.fase))};
}
function projName(b){
  if(b.nombre&&b.nombre.trim())return b.nombre.trim();
  const n=b.ambs.map(a=>a.name);if(!n.length)return 'Proyecto';
  const l=n.map((x,i)=>i?x.charAt(0).toLowerCase()+x.slice(1):x);
  return l.length===1?l[0]:l.slice(0,-1).join(', ')+' y '+l[l.length-1];
}

/* ====================== base compartida (Supabase) ====================== */
let sb=null,ME='',SNAP={settings:{},catalog:{},budgets:{}},SENT={};
let setReady=false,flushT,retryT,flushing=false,again=false,flushGen=0,rrPending=false,chan=null,wasSub=false;
const TBL={settings:'habitar_settings',catalog:'habitar_catalog',budgets:'habitar_budgets'};
const PILLS={saved:'Guardado',saving:'Guardando…',offline:'Sin conexión · reintentando',local:'Modo local · sin compartir',recon:'Reconectando…'};
function setPill(k){const p=$('#syncPill');if(!p)return;p.className='sync '+(k==='saved'?'':k==='recon'?'offline':k);p.textContent=PILLS[k]}
/* JSON canónico: claves ordenadas y sin las que empiezan con "_", así se puede comparar aunque la base reordene las claves */
function canon(v){
  const f=x=>Array.isArray(x)?x.map(f):(x&&typeof x==='object')?Object.keys(x).filter(k=>k[0]!=='_').sort().reduce((o,k)=>(o[k]=f(x[k]),o),{}):x;
  return JSON.stringify(f(v));
}
const nameOf=e=>{const n=String(e||'').split('@')[0];return n?n[0].toUpperCase()+n.slice(1):'alguien'};
function ago(iso){const m=Math.max(0,Math.round((Date.now()-new Date(iso).getTime())/6e4));
  if(m<1)return 'recién';if(m<60)return `hace ${m} min`;const h=Math.round(m/60);if(h<24)return `hace ${h} h`;const d=Math.round(h/24);return `hace ${d} ${d===1?'día':'días'}`}
function editedBy(b){return b._by?`<br><small>${b._by===ME?'Editaste':'Editó '+esc(nameOf(b._by))} · ${esc(ago(b._at))}</small>`:''}

/* adaptadores: cómo leer/escribir cada tabla en S */
const normCfg=c=>({...defaultCfg(),...c,semanas:{...defaultCfg().semanas,...((c||{}).semanas)}});
const AD={
  settings:{ids:()=>setReady?['main']:[],get:id=>id==='main'&&setReady?{cfg:S.cfg,ambientes:S.ambientes,meta:S.meta}:undefined,
    set:(id,d)=>{if(id!=='main'||!d||!d.cfg)return;setReady=true;S.cfg=normCfg(d.cfg);S.ambientes=d.ambientes||[];S.meta=d.meta||{exampleData:false}},del:()=>{}},
  catalog:{ids:()=>S.catalog.map(x=>x.id),get:id=>S.catalog.find(x=>x.id===id),
    set:(id,d)=>{const o=JSON.parse(JSON.stringify(d));const i=S.catalog.findIndex(x=>x.id===id);if(i>=0)S.catalog[i]=o;else S.catalog.push(o);S.catalog.sort((a,b)=>(a.ord||0)-(b.ord||0))},
    del:id=>{S.catalog=S.catalog.filter(x=>x.id!==id)}},
  budgets:{ids:()=>S.budgets.map(x=>x.id),get:id=>S.budgets.find(x=>x.id===id),
    set:(id,d)=>{const o=JSON.parse(JSON.stringify(d));const i=S.budgets.findIndex(x=>x.id===id);if(i>=0){o._by=S.budgets[i]._by;o._at=S.budgets[i]._at;S.budgets[i]=o}else S.budgets.push(o)},
    del:id=>{S.budgets=S.budgets.filter(x=>x.id!==id)}}
};
function ensureOrd(){let n=Date.now();S.catalog.forEach(it=>{if(it.ord==null)it.ord=n++})}
function localRows(){ensureOrd();const r={settings:{},catalog:{},budgets:{}};
  for(const t in AD)for(const id of AD[t].ids())r[t][id]=canon(AD[t].get(id));return r}
function stamp(t,id,by,at){if(t!=='budgets')return;const b=getB(id);if(b){b._by=by;b._at=at}}

/* ---- guardar: solo lo que cambió ---- */
function cloudDirty(){setPill('saving');if(flushing)again=true;clearTimeout(flushT);flushT=setTimeout(flush,600)}
function pendingCount(){const r=localRows();let n=0;for(const t in r){for(const id in r[t])if(SNAP[t][id]!==r[t][id])n++;for(const id in SNAP[t])if(!(id in r[t]))n++}return n}
async function flush(){
  clearTimeout(flushT);clearTimeout(retryT);
  if(flushing){again=true;return}
  flushing=true;flushGen++;
  try{
    const r=localRows();
    for(const t of ['catalog','budgets','settings']){  // settings al final: si algo falla, no queda "inicializado" a medias
      const ups=Object.keys(r[t]).filter(id=>SNAP[t][id]!==r[t][id]);
      const dels=Object.keys(SNAP[t]).filter(id=>!(id in r[t]));
      for(let i=0;i<ups.length;i+=50){
        const chunk=ups.slice(i,i+50);
        chunk.forEach(id=>{const k=t+id;(SENT[k]=SENT[k]||[]).push(r[t][id]);if(SENT[k].length>20)SENT[k].shift()});
        const {error}=await sb.from(TBL[t]).upsert(chunk.map(id=>({id,data:JSON.parse(r[t][id])})),{onConflict:'id'});
        if(error)throw error;
        chunk.forEach(id=>{SNAP[t][id]=r[t][id]});
      }
      if(dels.length){
        const {error}=await sb.from(TBL[t]).delete().in('id',dels);
        if(error)throw error;
        dels.forEach(id=>{delete SNAP[t][id];delete SENT[t+id]});
      }
    }
    setPill('saved');
  }catch(e){
    console.warn('habitar sync',e);setPill('offline');retryT=setTimeout(flush,5000);again=false;
  }finally{
    flushing=false;flushGen++;
    if(again){again=false;flush()}
  }
}

/* ---- recibir cambios del otro ---- */
function remoteApply(t,id,data,by,at){
  const loc=AD[t].get(id),rc=canon(data),lc=loc!==undefined?canon(loc):null;
  if(lc===rc){SNAP[t][id]=rc;stamp(t,id,by,at);return false}
  if((SENT[t+id]||[]).includes(rc)){stamp(t,id,by,at);return false}        // eco de lo que escribí yo
  if(loc!==undefined&&SNAP[t][id]!==lc)return false;                       // tengo un cambio mío sin enviar: gana el último en guardar
  AD[t].set(id,data);SNAP[t][id]=rc;stamp(t,id,by,at);return true;
}
function remoteDelete(t,id){
  const loc=AD[t].get(id);if(loc===undefined){delete SNAP[t][id];return false}
  if(canon(loc)!==SNAP[t][id])return false;
  AD[t].del(id);delete SNAP[t][id];return true;
}
function describe(t,id){return t==='budgets'?(getB(id)?.num||'un presupuesto'):t==='catalog'?'el catálogo':'los parámetros'}
function onRT(t,p){
  let changed=false,who='',what='';
  if(p.eventType==='DELETE'){const id=p.old&&p.old.id;if(!id)return;what=describe(t,id);changed=remoteDelete(t,id);who='alguien'}
  else{const r=p.new;if(!r)return;changed=remoteApply(t,r.id,r.data,r.updated_by,r.updated_at);what=describe(t,r.id);who=r.updated_by===ME?'Otro dispositivo':nameOf(r.updated_by)}
  if(changed){toast(`${who} actualizó ${what}`);scheduleRerender()}
}
function scheduleRerender(){
  const ae=document.activeElement;
  if(ae&&ae.closest&&ae.closest('#view')&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)){rrPending=true;return}
  rrPending=false;const y=scrollY;render();scrollTo(0,y);
}
document.addEventListener('focusout',()=>{if(rrPending)setTimeout(()=>{if(rrPending)scheduleRerender()},400)});

async function fetchAll(){
  const q=await Promise.all(Object.values(TBL).map(n=>sb.from(n).select('id,data,updated_by,updated_at')));
  const e=q.find(x=>x.error);if(e)throw e.error;
  return{settings:q[0].data,catalog:q[1].data,budgets:q[2].data};
}
async function reconcile(){
  const g=flushGen;const all=await fetchAll();let changed=false;
  const safeDel=!flushing&&g===flushGen;
  for(const t in all){
    const seen=new Set();
    for(const r of all[t]){seen.add(r.id);if(remoteApply(t,r.id,r.data,r.updated_by,r.updated_at))changed=true}
    if(safeDel)for(const id of Object.keys(SNAP[t]))if(!seen.has(id)&&remoteDelete(t,id))changed=true;
  }
  return{changed,empty:all.settings.length===0};
}
async function seedCloud(){
  let src=null;try{const r=localStorage.getItem(LS_KEY);if(r){const o=JSON.parse(r);if(o&&o.catalog&&o.budgets)src={...o,cfg:normCfg(o.cfg),meta:o.meta||{exampleData:false}}}}catch(e){}
  if(!src){src=seed();src.budgets[0].id='ejemplo-001'}
  const opt={onConflict:'id',ignoreDuplicates:true};
  const cat=src.catalog.map((it,i)=>({id:it.id,data:{...it,ord:i+1}}));
  for(let i=0;i<cat.length;i+=50){const {error}=await sb.from(TBL.catalog).upsert(cat.slice(i,i+50),opt);if(error)throw error}
  const bud=src.budgets.map(b=>({id:b.id,data:JSON.parse(JSON.stringify(b,(k,v)=>k[0]==='_'?undefined:v))}));
  if(bud.length){const {error}=await sb.from(TBL.budgets).upsert(bud,opt);if(error)throw error}
  const {error}=await sb.from(TBL.settings).upsert([{id:'main',data:{cfg:src.cfg,ambientes:src.ambientes,meta:src.meta}}],opt);
  if(error)throw error;
}
function importMerge(o){
  let nb=0,nc=0;
  (o.ambientes||[]).forEach(a=>{if(!S.ambientes.includes(a))S.ambientes.push(a)});
  (o.catalog||[]).forEach(it=>{const c={...it};delete c._by;delete c._at;const i=S.catalog.findIndex(x=>x.id===it.id);if(i>=0)S.catalog[i]=c;else{S.catalog.push(c)}nc++});
  (o.budgets||[]).forEach(b=>{const c=JSON.parse(JSON.stringify(b,(k,v)=>k[0]==='_'?undefined:v));const i=S.budgets.findIndex(x=>x.id===b.id);if(i>=0)S.budgets[i]=c;else S.budgets.push(c);nb++});
  ensureOrd();S.catalog.sort((a,b)=>a.ord-b.ord);save();UI.view='list';render();
  toast(`Copia importada: ${nb} presupuestos y ${nc} trabajos sumados. No se borró nada.`);
}

async function cloudBoot(){
  if(typeof supabase==='undefined'){showLogin('No se pudo cargar la conexión. Revisá internet y recargá la página.',true);return}
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  $('#loginForm').addEventListener('submit',async e=>{
    e.preventDefault();const b=$('#lgBtn');b.disabled=true;b.textContent='Entrando…';

  catch(e){showLogin('No se pudo conectar. Revisá internet y recargá.',true)}
}
let entered=false;
async function enter(session){
  if(entered)return;entered=true;
  try{
    const {data:ok,error}=await sb.rpc('is_habitar_user');
    if(error)throw error;
    if(!ok){entered=false;await sb.auth.signOut();showLogin('Este correo no tiene acceso al presupuestador.',true);return}
    ME=session.user.email||'';
    $('#whoName').textContent=nameOf(ME);$('#logout').hidden=false;setPill('saving');
    let r=await reconcile();
    if(r.empty){await seedCloud();r=await reconcile()}
    hideLogin();render();setPill('saved');subscribe();
  }catch(e){
    console.warn('habitar enter',e);entered=false;
    showLogin('No se pudo conectar con la base compartida. Revisá internet y probá de nuevo. Si sigue, avisale a Soley.',true);
  }
}
function subscribe(){
  chan=sb.channel('habitar-live');
  for(const t in TBL)chan.on('postgres_changes',{event:'*',schema:'public',table:TBL[t]},p=>onRT(t,p));
  chan.subscribe(st=>{
    if(st==='SUBSCRIBED'){setPill(flushing?'saving':'saved');if(wasSub)resync();wasSub=true}
    else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED')setPill('recon');
  });
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')resync();else flush()});
  window.addEventListener('online',()=>{flush();resync()});
  window.addEventListener('offline',()=>setPill('offline'));
  window.addEventListener('pagehide',()=>{flush()});
  window.addEventListener('beforeunload',e=>{if(flushing||pendingCount()>0){e.preventDefault();e.returnValue=''}});
}
async function resync(){try{const r=await reconcile();if(r.changed)scheduleRerender()}catch(e){}}

/* ====================== eventos ====================== */
async function nextNum(){
  const y=new Date().getFullYear();
  if(!CLOUD){S.counter++;return `HAB-${y}-${pad(S.counter,3)}`}
  const {data,error}=await sb.rpc('next_budget_number');
  if(error||data==null){toast('No se pudo numerar el presupuesto. Revisá la conexión.');return null}
  return `HAB-${y}-${pad(data,3)}`;
}
async function newBudget(){
  const num=await nextNum();if(!num)return;
  const b={id:uid(),num,status:'borrador',cliente:'',cuit:'',direccion:'',nombre:'',fecha:todayISO(),diag:'',noInc:null,ambs:[],sel:{},semanas:{},frozen:null};
  S.budgets.push(b);save();UI.view='editor';UI.id=b.id;render();window.scrollTo(0,0);
}
async function dupBudget(id){
  const o=getB(id);if(!o)return;const num=await nextNum();if(!num)return;
  const b=JSON.parse(JSON.stringify(o));delete b._by;delete b._at;b.id=uid();b.num=num;b.status='borrador';b.frozen=null;b.fecha=todayISO();
  S.budgets.push(b);save();UI.view='editor';UI.id=b.id;render();window.scrollTo(0,0);toast('Copia creada con precios actuales');
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,b=UI.view==='editor'?getB(UI.id):null;
  switch(a){
    case 'go':UI.view=t.dataset.v;render();window.scrollTo(0,0);break;
    case 'new':newBudget();break;
    case 'open':UI.view='editor';UI.id=t.dataset.id;render();window.scrollTo(0,0);break;
    case 'pdf':{const x=getB(t.dataset.id);if(x)doPrint(x);break}
    case 'print':if(b)doPrint(b);break;
    case 'dup':dupBudget(t.dataset.id);break;
    case 'del':if(!arm(t))return;S.budgets=S.budgets.filter(x=>x.id!==t.dataset.id);save();render();break;
    case 'toggleAmb':{if(!b||b.frozen)break;const n=t.dataset.name,i=b.ambs.findIndex(x=>x.name===n);
      if(i>=0)b.ambs.splice(i,1);
      else{b.ambs.push({name:n,sup:''});S.catalog.filter(it=>it.amb===n&&it.pack).forEach(it=>{if(!b.sel[it.id])b.sel[it.id]={on:true,qty:it.unit==='global'?1:''}})}
      save();const y=scrollY;render();scrollTo(0,y);break}
    case 'send':if(!b)break;
      b.frozen={cfg:JSON.parse(JSON.stringify(S.cfg)),items:JSON.parse(JSON.stringify(S.catalog.filter(it=>b.ambs.some(a=>a.name===it.amb))))};
      b.status='enviado';save();render();toast('Precios congelados. Este presupuesto ya no cambia si actualizás el catálogo.');break;
    case 'reopen':if(!b)break;b.frozen=null;b.status='borrador';save();render();toast('Reabierto. Vuelve a usar los precios actuales.');break;
    case 'catAdd':{const n=t.dataset.amb;S.catalog.push({id:uid(),amb:n,name:'Nuevo trabajo',inc:'',unit:'m²',mat:0,mo:0,fase:F.REV,pack:false,upd:todayISO(),ord:Date.now()});save();render();break}
    case 'catDel':if(!arm(t))return;S.catalog=S.catalog.filter(x=>x.id!==t.dataset.id);save();render();break;
    case 'ambAdd':{const v=$('#newAmb').value.trim();if(!v)break;if(S.ambientes.includes(v)){toast('Ese ambiente ya existe');break}S.ambientes.push(v);save();render();break}
    case 'ambDel':if(!arm(t))return;{const n=t.dataset.amb;S.ambientes=S.ambientes.filter(x=>x!==n);S.catalog=S.catalog.filter(x=>x.amb!==n);save();render()}break;
    case 'touch':{const it=S.catalog.find(x=>x.id===t.dataset.id);if(it){setUpd(it);save()}break}
    case 'bump':{const p=num($('#bumpPct').value);if(!p){toast('Escribí el porcentaje');break}if(!arm(t))return;
      const sc=$('#bumpScope').value;S.catalog.forEach(it=>{if(sc&&it.amb!==sc)return;it.mat=Math.round(it.mat*(1+p/100));it.mo=Math.round(it.mo*(1+p/100));it.upd=todayISO()});
      save();render();toast(`Precios ajustados ${fmtPct(p)} %`);break}
    case 'exampleOff':S.meta.exampleData=false;save();render();break;
    case 'confirmCfg':S.cfg.confirmed=true;save();render();toast('Parámetros confirmados');break;
    case 'export':{const blob=new Blob([JSON.stringify(S,(k,v)=>k[0]==='_'?undefined:v,1)],{type:'application/json'});const u=URL.createObjectURL(blob);
      const el=document.createElement('a');el.href=u;el.download=`habitar-presupuestador-${todayISO()}.json`;document.body.appendChild(el);el.click();el.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);break}
    case 'import':$('#importFile').click();break;
  }
});
$('#importFile').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.catalog||!o.budgets||!o.cfg)throw 0;
    if(CLOUD){importMerge(o);return}
    S=o;localStorage.setItem(LS_KEY,JSON.stringify(S));S=load();UI.view='list';render();toast('Copia importada')}catch(x){toast('El archivo no es una copia válida')}};
  r.readAsText(f);e.target.value='';
});
function onField(e){
  const t=e.target,d=t.dataset;
  const b=UI.view==='editor'?getB(UI.id):null;
  if(d.b!==undefined&&b){b[d.b]=t.value;if(d.b==='noInc'&&t.value==='')b.noInc=null;save();refreshEditor();return}
  if(d.bamb!==undefined&&b){const a=b.ambs.find(x=>x.name===d.bamb);if(a)a.sup=t.value;save();refreshEditor();return}
  if(d.sel!==undefined&&b){
    const s=b.sel[d.sel]||(b.sel[d.sel]={on:false,qty:''});
    if(d.f==='on'){s.on=t.checked;const row=t.closest('.irow'),q=$('[data-f="qty"]',row);
      row.classList.toggle('off',!s.on);q.disabled=!s.on;
      if(s.on&&!(num(s.qty)>0)){const it=ctx(b).items.find(i=>i.id===d.sel);if(it&&it.unit==='global'){s.qty=1;q.value=1}else if(e.type==='change')q.focus()}}
    else s.qty=t.value===''?'':num(t.value);
    save();refreshEditor();return}
  if(d.bsem!==undefined&&b){b.semanas=b.semanas||{};b.semanas[d.bsem]=Math.max(1,Math.round(num(t.value)));save();
    if(e.type==='change')refreshEditor();else{clearTimeout(pvT);pvT=setTimeout(()=>refreshEditor(),200)}return}
  if(d.cat!==undefined){
    const it=S.catalog.find(x=>x.id===d.cat);if(!it)return;
    if(d.f==='pack')it.pack=t.checked;
    else if(d.f==='mat'||d.f==='mo'){it[d.f]=num(t.value);setUpd(it)}
    else it[d.f]=t.value;
    save();return}
  if(d.ambname!==undefined&&e.type==='change'){
    const o=d.ambname,n=t.value.trim();if(!n||n===o)return;if(S.ambientes.includes(n)){toast('Ese ambiente ya existe');t.value=o;return}
    S.ambientes=S.ambientes.map(x=>x===o?n:x);S.catalog.forEach(it=>{if(it.amb===o)it.amb=n});
    S.budgets.forEach(bb=>{if(!bb.frozen)bb.ambs.forEach(a=>{if(a.name===o)a.name=n})});
    save();render();return}
  if(d.cfg!==undefined){S.cfg[d.cfg]=num(t.value);S.cfg.confirmed=false;save();return}
  if(d.cfgpay!==undefined){S.cfg.pay[+d.cfgpay]=num(t.value);S.cfg.confirmed=false;save();
    const s=S.cfg.pay.reduce((a,x)=>a+num(x),0);$('#paySum').textContent=s===100?'Suma 100 %.':`Suman ${s} %. Tienen que sumar 100.`;return}
  if(d.cfgtxt!==undefined){S.cfg[d.cfgtxt]=t.value;save();return}
  if(d.cfgsem!==undefined){S.cfg.semanas[d.cfgsem]=Math.max(1,Math.round(num(t.value)));save();return}
}
$('#view').addEventListener('input',onField);
$('#view').addEventListener('change',onField);

$('#logoTop').src=LOGO_CACAO;$('#loginLogo').src=LOGO_CACAO;
if(CLOUD)cloudBoot();
else{setPill('local');render()}
</script>
